<html>
<head>
    <meta charset="utf-8">
    <title>Exercício 2</title>
    <style>
        body {
        background-color: #020101;
        font-family: 'Times New Roman', Times, serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        }
        .container{
        background-color: #53080D;
        color: #FDF0D5;
        padding: 10px;
        max-width: 600px;
        width: 90%;
        text-align: center;
        border-radius: 15px;
        }
        button {
        background-color: #ceceda;
        border: none;
        border-radius: 5px;
        color: #130d0d;
        padding: 10px;
        margin: 5px;
        cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
    <h1>Calculadora</h1>
    <p>Calcule a soma e a multiplicação de dois números:</p>
    <button onclick="calcular()">Calcular</button>

    <script>
    function calcular() {
        let n1 = Number(prompt("Digite o primeiro número:"));
        let n2 = Number(prompt("Digite o segundo número:"));

        let soma = n1 + n2;
        let mult = n1 * n2;

        alert("Soma: " + soma + "\nMultiplicação: " + mult);
    }
    </script>

</body>
</html>

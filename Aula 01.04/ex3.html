<html>
<head>
    <meta charset="utf-8">
    <title>Exercício 3</title>
    <style>
        body {
        background-color: #020101;
        font-family: 'Times New Roman', Times, serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        }
        .container{
        background-color: #53080D;
        color: #FDF0D5;
        padding: 10px;
        max-width: 600px;
        width: 90%;
        text-align: center;
        border-radius: 15px;
        }
        button {
        background-color: #ceceda;
        border: none;
        border-radius: 5px;
        color: #130d0d;
        padding: 10px;
        margin: 5px;
        cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
    <h1 id="contar">Contador de cliques: 0</h1>

    <button onclick="contar()">Clique aqui</button>
    </div>
    
    <script>
    let cliques = 0;

    function contar() {
        cliques++;
        document.getElementById("contar").innerHTML = "Contador de cliques: " + cliques;
    }
    </script>

</body>
</html>

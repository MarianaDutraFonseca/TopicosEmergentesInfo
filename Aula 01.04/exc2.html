<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício 2</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f7fa; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .box { background: #fff; border-radius: 8px; box-shadow: 0 4px 12px rgba(0,0,0,.1); padding: 24px; max-width: 420px; width: 100%; text-align: center; }
    button { padding: 10px 16px; border: none; border-radius: 4px; background: #007bff; color: #fff; cursor: pointer; font-size: 1rem; }
    button:hover { background: #0056b3; }
    .result { margin-top: 16px; font-size: 1.1rem; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Digite dois números</h1>
    <button id="calcBtn">Calcular</button>
    <div class="result" id="result"></div>
  </div>
  <script>
    const calcBtn = document.getElementById('calcBtn');
    const resultDiv = document.getElementById('result');

    calcBtn.addEventListener('click', () => {
      const n1 = Number(prompt('Digite o primeiro número:'));
      const n2 = Number(prompt('Digite o segundo número:'));

      if (Number.isNaN(n1) || Number.isNaN(n2)) {
        resultDiv.textContent = 'Por favor, digite valores numéricos válidos.';
        return;
      }

      const soma = n1 + n2;
      const mult = n1 * n2;

      resultDiv.innerHTML = `Soma: <strong>${soma}</strong><br>Multiplicação: <strong>${mult}</strong>`;
    });
  </script>
</body>
</html>

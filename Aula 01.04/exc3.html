<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercício 3 - Contador de Cliques</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef2f7; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #fff; border-radius: 10px; padding: 24px 32px; box-shadow: 0 4px 12px rgba(0,0,0,.12); text-align: center; }
    button { padding: 10px 20px; font-size: 1rem; border-radius: 6px; border: none; background: #28a745; color: white; cursor: pointer; }
    button:hover { background: #218838; }
    .count { margin-top: 16px; font-size: 1.25rem; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Contador de Cliques</h1>
    <button id="clickBtn">Clique aqui</button>
    <div class="count" id="clickCount">Cliques: 0</div>
  </div>

  <script>
    const clickBtn = document.getElementById('clickBtn');
    const clickCount = document.getElementById('clickCount');
    let totalCliques = 0;

    clickBtn.addEventListener('click', () => {
      totalCliques += 1;
      clickCount.textContent = `Cliques: ${totalCliques}`;
    });
  </script>
</body>
</html>

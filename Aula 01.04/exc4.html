<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média Escolar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }
        
        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #764ba2;
        }
        
        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 5px;
            text-align: center;
            display: none;
        }
        
        .result.show {
            display: block;
        }
        
        .result h2 {
            margin: 0 0 10px 0;
            color: #333;
        }
        
        .media {
            font-size: 24px;
            font-weight: bold;
            margin: 15px 0;
        }
        
        .status {
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
        }
        
        .aprovado {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }
        
        .recuperacao {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffc107;
        }
        
        .reprovado {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
        }
        
        .error {
            color: #dc3545;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Calculadora de Média</h1>
        
        <form onsubmit="calcularMedia(event)">
            <div class="form-group">
                <label for="nota1">Primeira Nota:</label>
                <input 
                    type="number" 
                    id="nota1" 
                    min="0" 
                    max="10" 
                    step="0.1" 
                    placeholder="Digite a primeira nota"
                    required
                >
            </div>
            
            <div class="form-group">
                <label for="nota2">Segunda Nota:</label>
                <input 
                    type="number" 
                    id="nota2" 
                    min="0" 
                    max="10" 
                    step="0.1" 
                    placeholder="Digite a segunda nota"
                    required
                >
            </div>
            
            <button type="submit">Calcular Média</button>
        </form>
        
        <div id="erro" class="error"></div>
        
        <div id="resultado" class="result">
            <h2>Resultado</h2>
            <div class="media">Média: <span id="mediaValor">0.00</span></div>
            <div class="status" id="status"></div>
        </div>
    </div>
    
    <script>
        function calcularMedia(event) {
            event.preventDefault();
            
            const nota1 = parseFloat(document.getElementById('nota1').value);
            const nota2 = parseFloat(document.getElementById('nota2').value);
            const erroDiv = document.getElementById('erro');
            const resultadoDiv = document.getElementById('resultado');
            const statusDiv = document.getElementById('status');
            const mediaSpan = document.getElementById('mediaValor');
            
            // Validar se as notas estão dentro do intervalo
            if (nota1 < 0 || nota1 > 10 || nota2 < 0 || nota2 > 10) {
                erroDiv.textContent = 'Por favor, digite notas entre 0 e 10!';
                erroDiv.style.display = 'block';
                resultadoDiv.classList.remove('show');
                return;
            }
            
            erroDiv.style.display = 'none';
            
            // Calcular a média
            const media = (nota1 + nota2) / 2;
            mediaSpan.textContent = media.toFixed(2);
            
            // Determinar o status
            let statusTexto = '';
            resultadoDiv.classList.remove('aprovado', 'recuperacao', 'reprovado');
            
            if (media >= 7) {
                statusTexto = '✓ APROVADO';
                resultadoDiv.classList.add('aprovado');
            } else if (media >= 1.7) {
                statusTexto = '⚠ RECUPERAÇÃO';
                resultadoDiv.classList.add('recuperacao');
            } else {
                statusTexto = '✗ REPROVADO';
                resultadoDiv.classList.add('reprovado');
            }
            
            statusDiv.textContent = statusTexto;
            resultadoDiv.classList.add('show');
        }
    </script>
</body>
</html>

<html>
    <head>
    <meta charset="utf-8">

    <script>
        function validar(){
        let valor = document.getElementById("cpf").value;
        let regex = /^[0-9]{5}-[0-9]{3}$/;
        if (regex.test(valor)){
            alert("CPF válido!");
        } else {
            alert("CPF inválido!");
        }
        }
        function validar(){
        let valor = document.getElementById("celular").value;
        let regex = /^\(\d{2}\)\s\d{5}-\d{4}$/;
        if (regex.test(valor)){
            alert("Numero válido!");
        } else {
            alert("Numero inválido!");
        }
        }
    </script>
    </head>

    <body>
    <h2>Formulário</h2>

        <form>
        <label for="cpf">CPF:</label>
        <input type="text" id="cpf"><br></br>

        <label for="Senha">Senha:</label>
        <input type="text" name="senha"><br></br>

        <label for="email">Email:</label>
        <input type="email" name="email"><br></br>

        <label for="celular">Número de Celular:</label>
        <input type="number" name="celular"><br></br>
        <button onclick="validar()">Validar</button>
        </form>
    </body>
</html>

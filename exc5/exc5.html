<html>
    <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">
    </head>

<body>
<div class="inicio">
<h2>Formulário</h2>

<form  id="formulario">
    <label>Nome Completo:</label>
    <input type="text" id="nome" required><br><br>

    <label>CPF:</label>
    <input type="text" id="cpf" required><br><br>

    <label>Telefone:</label>
    <input type="text" id="telefone" required><br><br>

    <label>Data de Nascimento:</label>
    <input type="text" id="data" required><br><br>

    <label>CEP:</label>
    <input type="text" id="cep" required><br><br>

    <label>Email:</label>
    <input type="email" id="email" required><br><br>
    <button type="submit">Validar</button>

</form>
</div>

<script>
    const cpf = document.getElementById("cpf");
    const telefone = document.getElementById("telefone");
    const data = document.getElementById("data");
    const cep = document.getElementById("cep");

    cpf.addEventListener("input", () => {
    let valor = cpf.value.replace(/\D/g, "");
    valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
    valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
    valor = valor.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
    cpf.value = valor;
    });

    telefone.addEventListener("input", () => {
    let valor = telefone.value.replace(/\D/g, "");
    valor = valor.replace(/^(\d{2})(\d)/, "($1) $2");
    valor = valor.replace(/(\d{5})(\d)/, "$1-$2");
    telefone.value = valor;
    });

    data.addEventListener("input", () => {
    let valor = data.value.replace(/\D/g, "");
    valor = valor.replace(/(\d{2})(\d)/, "$1/$2");
    valor = valor.replace(/(\d{2})(\d)/, "$1/$2");
    data.value = valor;
    });

    cep.addEventListener("input", () => {
    let valor = cep.value.replace(/\D/g, "");
    valor = valor.replace(/(\d{5})(\d)/, "$1-$2");
    cep.value = valor;
    });


    document.getElementById("formulario").addEventListener("submit", function(e){
    if (!this.checkValidity()) {
    return;
    } e.preventDefault();

    let nome = document.getElementById("nome").value;
    let email = document.getElementById("email").value;
    let regexEmail = /^[^\s@]+@[^\s@]+\.com$/;

    if (nome.trim() === "") {
    alert("Nome obrigatório!");
    return;
    }
    if (!regexEmail.test(email)) {
    alert("Email inválido!");
    return;
    }
    if (cpf.value.length < 14) {
    alert("CPF inválido!");
    return;
    }
    if (telefone.value.length < 15) {
    alert("Telefone inválido!");
    return;
    }
    if (data.value.length < 10) {
    alert("Data inválida!");
    return;
    }
    if (cep.value.length < 9) {
    alert("CEP Inválido!");
    return;
    }
    alert("Formulário enviado com sucesso!");
    });
</script>

</body>
</html>
